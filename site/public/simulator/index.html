<style id="site-theme">
/* Site theme for the simulator, added by sync-simulator.mjs to the copy in
   public/simulator/ (preview/Factory_Simulator.html itself stays as is).
   Values follow site/src/styles/tokens.css. */
:root {
  --bg: #f2ece0;        /* --surface */
  --panel: #f8f4ea;     /* --surface-raised */
  --ink: #1f1d18;
  --ink2: #4a463c;      /* --ink-secondary */
  --muted: #7b7566;     /* --ink-muted */
  --rule: #ddd5c4;      /* --grid */
  --blue: #1f1d18;      /* the simulator's accent: the site's ink */
  --water: #2a78d6;
  --orange: #eb6834;
  --good: #1b7c61;
  --bad: #a8431c;       /* red is the site's legal-cap colour only */
  --hyp: #6754bd;
  --emp: #1b7c61;
  --cal: #7b7566;
  --ph: #c0731f;
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* The building drawing is a white-ground JPEG: multiply drops its white
   onto the sand ground instead of leaving a white box. */
#scene { mix-blend-mode: multiply; }
/* The scaled stage is its own stacking context: give it the ground to blend on. */
#stage { background: var(--bg); }

/* Titles in the site's serif, like its scene and chart titles. */
.title h1 { font-family: var(--serif); font-size: 30px !important; font-weight: 600; letter-spacing: 0; line-height: 1.1; }
.floor .fl b { font-family: var(--serif); font-weight: 600; color: var(--ink); letter-spacing: 0; font-variant-numeric: lining-nums; }
@keyframes fflash { 0% { color: var(--orange); } 100% { color: var(--ink); } }
.evcap .et { font-family: var(--serif); font-weight: 600 !important; font-size: 34px !important; letter-spacing: 0 !important; }
.evcap .now, .evcap .ef, .logi .hd, .card .ch b, #projWrap .sec {
  font-family: var(--sans); font-size: 12px !important; font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
}
#projWrap .sec { border-top: 1px solid var(--rule); }
.evcap p { font-family: var(--sans); }

/* Panels and the projection ring on the site's raised sand. */
.card, .logi { background: var(--panel); border-color: var(--rule); box-shadow: none; }
#projRing { background: var(--panel); border-width: 2px; box-shadow: none; }
#projTag, .nav button { background: var(--panel); border-color: var(--rule); color: var(--ink2); }

/* Scenario buttons: the site's tab pills. */
.presets button, .resetb {
  background: transparent !important; border: 1px solid var(--rule) !important; color: var(--ink2) !important;
  font-family: var(--sans) !important; font-size: 15px !important; font-weight: 400 !important;
}
.presets button:hover, .resetb:hover { border-color: var(--muted) !important; color: var(--ink) !important; }
.presets button[aria-pressed="true"] { border-color: var(--ink) !important; color: var(--ink) !important; font-weight: 600 !important; }
button:focus-visible { outline: 2px solid var(--ink); }

/* Sliders: ink thumb rings on the sand. */
.ctl input[type=range]::-webkit-slider-thumb { background: var(--panel); }
.ctl .trk .base { background: var(--panel); }
.ctl.out .trk .rail { background: var(--rule); }
.ctl.out .trk .fill { background: #c9c1b0; }
.ctl.out .trk .fill.better { background: var(--good); }
.ctl.out .trk .fill.worse { background: var(--bad); }
.ctl.out .vv.better, .ctl.out .vv.better i { color: var(--good); }
.ctl.out .vv.worse, .ctl.out .vv.worse i { color: var(--bad); }
.ctl .vv.up, .ctl .vv.up i { color: var(--water); }
.ctl .vv.down, .ctl .vv.down i { color: var(--bad); }
.note3 input { background: var(--panel); }
#effPanel { border-color: var(--hyp); }
</style>
</head>

/* compatibility: older Safari/Chrome lack CanvasRenderingContext2D.roundRect */
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);
  this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};}
/* =====================================================================
   1. NOTEBOOK ENGINE — Eleanor_Electronics_Manufacturing_Ecosystem.ipynb, Section 3 simulate(), line for line
   ===================================================================== */
const clip=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const BASELINE={hourly_wage:1,material_availability:1,water_availability:1,environmental_regulation:0,tariff:0,
  work_hours:1,automation:1,manufacturing_complexity:1,shipping_distance:1,dispatch_share:0.5};
function simulate(inputs){
  const x={...BASELINE,...inputs};
  const robot_adoption_baseline=0.0019;
  const robot_adoption_probability=clip(robot_adoption_baseline+0.011*(x.hourly_wage-1.0),0.0,1.0);
  const automation_effective=clip(x.automation+robot_adoption_probability-robot_adoption_baseline,0.40,2.00);
  let labor_stability=Math.exp(0.18*(x.hourly_wage-1.0)-0.30*(x.work_hours-1.0)-0.35*(x.dispatch_share-0.50));
  labor_stability=clip(labor_stability,0.80,1.15);
  const turnover_cost_multiplier=clip(1.0-0.045*(labor_stability-1.0)/0.15,0.955,1.060);
  const automation_energy_factor=Math.pow(automation_effective,-0.023);
  const complexity_energy_factor=Math.pow(10,0.35*(x.manufacturing_complexity-1.0));
  let water_productivity_factor;
  if(x.water_availability>=1.00)water_productivity_factor=1.0000;
  else if(x.water_availability>=0.85)water_productivity_factor=0.9807;
  else water_productivity_factor=0.9460;
  const regulation=clip(x.environmental_regulation,0.0,0.50);
  const technique_reduction=0.753*regulation,regulation_output_factor=1.0-0.247*regulation;
  const productivity=Math.pow(automation_effective,0.15)*Math.pow(labor_stability,0.35)*water_productivity_factor;
  const yield_index=clip(1.0+0.10*(labor_stability-1.0)-0.04*(x.manufacturing_complexity-1.0),0.90,1.03);
  const labor_input=Math.pow(x.work_hours,0.55);
  const material_constraint=Math.min(1.0,Math.max(0.0,x.material_availability));
  const production=labor_input*productivity*yield_index*material_constraint*regulation_output_factor;
  const power_use=production*complexity_energy_factor*automation_energy_factor;
  const water_demand=production*Math.pow(x.manufacturing_complexity,0.70)*(1.0-0.35*technique_reduction);
  const water_use=Math.min(water_demand,x.water_availability);
  const electricity_emissions=29.15*power_use*(1.0-technique_reduction);
  const material_process_emissions=12.65*production*Math.pow(x.manufacturing_complexity,0.40)*(1.0-technique_reduction);
  const transport_emissions=2.20*production*x.shipping_distance;
  const renewable_energy_emissions=0.55*power_use;
  const use_phase_emissions=9.90,end_of_life_emissions=0.55;
  const emissions=electricity_emissions+material_process_emissions+transport_emissions+renewable_energy_emissions+use_phase_emissions+end_of_life_emissions;
  const shipping_reliability=clip(1.0/x.shipping_distance,0.60,1.00);
  let supply_reliability=Math.pow(Math.max(x.material_availability,0.01)*Math.max(x.water_availability,0.01)*shipping_reliability*labor_stability,0.25);
  supply_reliability=clip(supply_reliability,0.0,1.10);
  const labor_cost=0.25*x.hourly_wage*x.work_hours/Math.max(productivity*yield_index,0.10);
  const material_cost=0.35*(1.0/Math.max(x.material_availability,0.25))*Math.pow(x.manufacturing_complexity,0.25);
  const energy_cost=0.10*power_use/Math.max(production,0.10);
  const logistics_cost=0.10*x.shipping_distance*(1.0+x.tariff);
  const automation_cost=0.10*Math.pow(automation_effective,0.35);
  const other_cost=0.10;
  const final_cost=(labor_cost+material_cost+energy_cost+logistics_cost+automation_cost+other_cost)*turnover_cost_multiplier;
  return {production,final_cost_index:final_cost,power_use_index:power_use,water_use_index:water_use,emissions_kg_CO2e:emissions,
    supply_reliability,productivity,yield_index,labor_stability,automation_effective,robot_adoption_probability};
}
/* emission terms exactly as summed inside simulate() (electricity incl. the 0.55 renewable term, process, transport, fixed use-phase + end-of-life) */
function emissionParts(xIn){const x={...BASELINE,...xIn},r=simulate(xIn),tr=.753*clip(x.environmental_regulation,0,.5);
  return {electricity:29.15*r.power_use_index*(1-tr)+0.55*r.power_use_index,process:12.65*r.production*Math.pow(x.manufacturing_complexity,.4)*(1-tr),transport:2.2*r.production*x.shipping_distance,fixed:9.90+0.55};}
/* not returned by simulate(), recomputed from the same notebook line, used only to show when the water cap binds */
const waterDemand=(x,r)=>r.production*Math.pow(x.manufacturing_complexity,0.70)*(1.0-0.35*0.753*clip(x.environmental_regulation,0,0.5));

/* ---- HYPOTHESIS (not in notebook): fixed price giving the baseline MARGIN; profit = production × (price − cost), baseline = 100% ---- */
let MARGIN=0.05;
/* ---- HYPOTHESIS (not in notebook): efficiency wages. A modest raise cuts turnover, hiring and rework costs enough to pay
   for itself; the savings level off (tanh) while the wage bill keeps growing. Wage cuts raise those costs faster.
   Tuned so profit peaks near a 10% raise and falls back below baseline near +22%. ---- */
let EFF_WAGE=false;
const effSaving=w=>w>=1?0.035*Math.tanh((w-1)/0.10):0.10*Math.tanh((w-1)/0.15);
function model(x){const r=simulate(x),P=1/(1-MARGIN);
  if(EFF_WAGE)r.final_cost_index*=1-effSaving(({...BASELINE,...x}).hourly_wage);r.profit=100*r.production*(P-r.final_cost_index)/(P-1);r.water_demand=waterDemand({...BASELINE,...x},r);return r;}

/* =====================================================================
   2. INPUTS (notebook names, SENSITIVITY_RANGES, baseline_metadata confidence) and OUTPUTS
   ===================================================================== */

/* ---- every output is a slider too. Drag one and the notebook model is solved backwards for the inputs that
        produce it; the output sliders glide when the change reaches their floor, so all sliders move together. ---- */
const evalO=(W,id)=>model(W)[id];
const X0={...X};
function setupOut(o){
  o.drivers=INPUTS.filter(L=>!L.hidden).map(L=>({id:L.id,eff:Math.abs(evalO({...X0,[L.id]:L.max},o.id)-evalO({...X0,[L.id]:L.min},o.id))}))
    .filter(x=>x.eff>1e-9).sort((a,b)=>b.eff-a.eff).map(x=>x.id);
  const push=dir=>{const W={...X0};for(let p=0;p<2;p++)o.drivers.forEach(d=>{const L=IN[d],a=evalO({...W,[d]:L.min},o.id),b=evalO({...W,[d]:L.max},o.id);W[d]=(dir>0?b>=a:b<=a)?L.max:L.min;});return W;};
  o.extLo=push(-1);o.extHi=push(1);
  const one=INPUTS.filter(L=>!L.hidden).flatMap(L=>[evalO({...X0,[L.id]:L.min},o.id),evalO({...X0,[L.id]:L.max},o.id)]);
  const lo=Math.min(...one,B[o.id]),hi=Math.max(...one,B[o.id]),pad=(hi-lo)*.06;o.min=lo-pad;o.max=hi+pad;
  if(o.max-o.min<1e-9){o.min=B[o.id]*.99;o.max=B[o.id]*1.01;}
}
OUTPUTS.forEach(setupOut);
function solveOut(o,target){
  const W={...X},tol=(o.max-o.min)*1e-4;
  for(let p=0;p<2;p++)for(const d of o.drivers){
    const L=IN[d],f=x=>evalO({...W,[d]:x},o.id)-target,now=f(W[d]);if(Math.abs(now)<tol)return W;
    if(p===0&&d!==o.drivers[0]&&Math.abs(evalO({...W,[o.drivers[0]]:W[o.drivers[0]]},o.id)-target)<tol)return W;
    let a=L.min,b=L.max,fa=f(a),fb=f(b),x;
    if(fa*fb<=0){for(let i=0;i<44;i++){const m=(a+b)/2,fm=f(m);if(fa*fm<=0){b=m;fb=fm;}else{a=m;fa=fm;}}x=Math.round((a+b)/2*100)/100;}
    else x=Math.abs(fa)<Math.abs(fb)?L.min:L.max;
    if(Math.abs(f(x))<Math.abs(now)-1e-12)W[d]=clip(x,L.min,L.max);
  }
  const g=Z=>evalO(Z,o.id)-target,r0=g(W);           // several inputs together (e.g. water use is capped by availability)
  if(Math.abs(r0)>tol){const E=r0<0?o.extHi:o.extLo,at=k=>{const Z={...W};o.drivers.forEach(d=>Z[d]=W[d]+(E[d]-W[d])*k);return Z;};
    let a=0,b=1,ga=r0,gb=g(at(1));if(ga*gb<=0){for(let i=0;i<40;i++){const m=(a+b)/2,gm=g(at(m));if(ga*gm<=0){b=m;gb=gm;}else{a=m;ga=gm;}}}else if(Math.abs(gb)>=Math.abs(r0))return W;
    const Z=at(b);o.drivers.forEach(d=>W[d]=clip(Math.round(Z[d]*100)/100,IN[d].min,IN[d].max));}
  return W;
}

function paintOut(o){if(o.hidden)return;

  if(Math.abs((o._act||0)-act)>.02){o._act=act;o.el.parentElement.style.setProperty('--act',act.toFixed(2));}
  const f=clip((v-o.min)/(o.max-o.min),0,1),p=(f*100).toFixed(1),ch=v/B[o.id]-1,sg=Math.abs(ch)<5e-4?0:Math.sign(ch)*o.good,cls=sg>0?'better':sg<0?'worse':'same';
  if(o._p!==p||o._cls!==cls){o._p=p;o._cls=cls;const a=Math.min(f,o.bp),b2=Math.max(f,o.bp);o.fill.style.left=(a*100)+'%';o.fill.style.width=Math.max(.6,(b2-a)*100)+'%';
    o.fill.className='fill '+cls;o.vv.className='vv '+cls;}
  const txt=`${fmtOut(o,v)}<i>${pctTxt(v/B[o.id]-1)}</i>`;if(o._txt!==txt){o._txt=txt;o.vv.innerHTML=txt;}
}

function setInput(id,v){
  X[id]=clip(v,IN[id].min,IN[id].max);paintCtl(IN[id]);drivers=[id];driverName=IN[id].name.toLowerCase();
  T=model(X);lastInputT=performance.now();schedule([id]);markPreset();
}
function schedule(ids){
  const order={};ids.forEach(id=>PATH[id].forEach((f,k)=>{order[f]=Math.min(order[f]??9,k);}));
  const now=performance.now();
  dirty=true;lastInputT=now;current=null;showCaption();
  Object.entries(order).forEach(([f,k])=>{f=+f;
    if(!pending[f])pending[f]={due:now+80+k*STEP_MS,k};});
  // causal dots between consecutive floors on the first input's path
  const p=PATH[ids[0]];for(let k=0;k<p.length-1;k++)pulses.push({a:p[k],b:p[k+1],t0:now+80+k*STEP_MS,dur:STEP_MS});
}
function applyFloor(f){
  const changed=[];
  OUTPUTS.filter(o=>o.floor===f).forEach(o=>{if(Math.abs(T[o.id]-S[o.id])>Math.abs(B[o.id])*2e-4)changed.push([o,S[o.id],T[o.id]]);S[o.id]=T[o.id];});
  if(f===4)S.water_demand=T.water_demand;
  paintCard(f);floorFlash[f]=performance.now();
  const fe=document.getElementById('floor'+f),ce=document.getElementById('card'+f);
  [fe,ce].filter(Boolean).forEach(e=>{e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');});
  changed.filter(([o,a,b])=>!o.hidden&&Math.abs(b/B[o.id]-1)>=0.005).forEach(([o,a,b])=>{
    const c=confFor(o);
    const old=whyLabels.findIndex(w=>w.id===o.id);if(old>=0)whyLabels.splice(old,1);
    whyLabels.push({id:o.id,o,t0:performance.now(),text:`${o.name} ${pctTxt(b/B[o.id]-1)}`,conf:c});
  });
}

function drawFx(t,dt){
  const c=fctx;c.setTransform(K,0,0,K,0,0);c.clearRect(0,0,1920,1080);
  /* ---------- 1F ---------- */
  const stab=D.labor_stability,hrs=X.work_hours,mat=X.material_availability;
  // worker density ∝ labor hours, lean ∝ hours strain, pace ∝ productivity, shirt hue ∝ stability
  const nBase=clip(Math.round(2+3*D_in('work_hours')),3,6),cut=Math.round(clip((D_in('automation')-1)*6,0,3)),n=Math.max(1,nBase-cut);   // hypothesis layer: robots take line stations
  {const techs=Math.round(clip((D_in('automation')-1)*4,0,2));[[628,742],[905,742]].slice(0,techs).forEach(([x,y],i)=>{const [px,py]=I(x,y);
    person(c,px,py,{aL:[1.4,1.2],aR:[.9,.9],lean:.08,jump:Math.max(0,Math.sin(t/1000*2+i))*1});});}
  for(let i=n;i<nBase;i++){const [x,y]=WORKER_SPOTS[i];c.setLineDash([3,3]);c.strokeStyle='rgba(150,158,170,.8)';c.lineWidth=1.5;c.beginPath();c.ellipse(x,y,14,5,0,0,7);c.stroke();c.setLineDash([]);}
  const shirt=rgb(stab>=1?mix([47,94,190],[30,120,170],(stab-1)/.15):mix([47,94,190],[150,120,110],(1-stab)/.2));
  const halo=stab>=1?rgb(GOOD,.10+.25*(stab-1)/.15):rgb(BAD,.10+.35*(1-stab)/.2);
  const lean=clip((D_in('work_hours')-1)*0.9,-.08,.3);
  const skit1F=EVENTS.some(e=>active.has(e.id)&&PEOPLE_1F.includes(e.skit)&&!(e.id==='stab_lo'&&active.has('hours')));
  for(let i=0;i<(skit1F?0:n);i++){const [x,y]=WORKER_SPOTS[i];
    c.fillStyle=halo;c.beginPath();c.ellipse(x,y,17,6,0,0,7);c.fill();
    person(c,x,y,{lean:lean+.15,...WORK_POSE(t/1000,i,D.productivity),jump:Math.max(0,Math.sin(t/1000*(2+3*D.productivity)+i*1.7))*1.2});}
  // assembly line: speed ∝ productivity × yield × material; pauses when parts run short
  const pauseFrac=mat<1?clip((1-mat)*1.6,0,.8):0,cyc=(t/4000)%1,paused=cyc<pauseFrac;
  const speed=paused?0:0.07*D.productivity*D.yield_index*Math.min(1,mat);
  lineT1+=speed*dt/1000;lineT2+=speed*dt/1000*.9;
  for(let k=0;k<4;k++){[[LINE1,lineT1],[LINE2,lineT2]].forEach(([L,ph],j)=>{const u=(ph+k/4)%1;const [x,y]=along(L,u);
    const bad=(1-D.yield_index)>0.002&&((k+j)%Math.max(2,Math.round(0.03/Math.max(1e-3,1-D.yield_index))))===0;
    box(c,x,y-8,12,7,bad?'#eb6834':'#9aa3b2',bad?'#fff4ea':'#fff');});}
  if(paused){const [x,y]=I(690,830);c.font=SANS(600,10);c.fillStyle=rgb(ORANGE);c.textAlign='center';c.fillText('LINE PAUSED · waiting for parts',x,y);}

    c.strokeStyle=rgb(tone,.8);c.lineWidth=2.5;c.setLineDash([7,6]);c.beginPath();c.moveTo(sx,sy);c.lineTo(ex,ey);c.stroke();c.setLineDash([]);}
}
let projC=[700,600],projZ=2.0;
function currentLoc(t){
  if(current&&t-curStart>EV_MS&&autoLeft>1){autoLeft--;pIdx++;current=playlist[pIdx];curStart=t;showCaption();}
  return current;
}
const LIVE={1:[690,880],2:[740,670],3:[700,440],4:[760,210]};
function drawProj(){
  const c=pctx,R=440;const target=current?I(...locOf(current)):I(...LIVE[lastFloor]),z=current?2.3:1.8;
  projC=[lerp(projC[0],target[0],.08),lerp(projC[1],target[1],.08)];projZ=lerp(projZ,z,.06);
  c.setTransform(1,0,0,1,0,0);c.fillStyle='#f2ece0';c.fillRect(0,0,880,880);
  const el=current?(performance.now()-curStart)/1000:9,sh=el<1.4?9*(1-el/1.4):0,jx=(Math.random()-.5)*sh,jy=(Math.random()-.5)*sh;
  c.setTransform(projZ*2,0,0,projZ*2,R-projC[0]*projZ*2+jx,R-projC[1]*projZ*2+jy);
  if(img.complete){c.globalCompositeOperation='multiply';c.drawImage(img,OX,OY,780*SZ,1068*SZ);c.globalCompositeOperation='source-over';}
  c.drawImage(fx,0,0,fx.width,fx.height,0,0,1920,1080);
  c.setTransform(1,0,0,1,0,0);
  const tone=current?(current.tone==='good'?GOOD:current.tone==='warn'?AMBER:BAD):BLUE,pa=current?.22+.16*Math.sin(performance.now()/260):.10;
  const g=c.createRadialGradient(R,R,R*.68,R,R,R);g.addColorStop(0,rgb(tone,0));g.addColorStop(1,rgb(tone,pa));c.fillStyle=g;c.fillRect(0,0,880,880);
  if(current){const a=el<.3?el/.3:1;c.globalAlpha=a;c.font=SANS(700,38);const w=c.measureText(current.title).width+56;
    c.fillStyle=rgb(tone,.92);c.beginPath();c.roundRect(R-w/2,R+170,w,64,32);c.fill();c.fillStyle='#fff';c.textAlign='center';c.fillText(current.title,R,R+215);c.globalAlpha=1;}
}

let prev=performance.now();
function frame(t){
  const dt=Math.min(64,t-prev);prev=t;
  // apply floors whose turn has come (causal order)
  Object.keys(pending).forEach(f=>{if(t>=pending[f].due){delete pending[f];applyFloor(+f);lastFloor=+f;if(!current)showCaption();}});
  if(dirty&&!Object.keys(pending).length&&t-lastInputT>700){dirty=false;evaluateEvents();}
  // ease displayed values toward staged values
  const k=1-Math.exp(-dt/260);Object.keys(S).forEach(id=>{D[id]=lerp(D[id]??S[id],S[id],k);});
  INPUTS.forEach(i=>{DI[i.id]=lerp(DI[i.id],X[i.id],k);});
  OUTPUTS.forEach(paintOut);if(EFF_WAGE&&(frame._w!==X.hourly_wage||frame._m!==MARGIN)){frame._w=X.hourly_wage;frame._m=MARGIN;drawEff();}
  try{drawFx(t,dt);drawUI(t);drawProj();}catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
evaluateEvents();requestAnimationFrame(frame);

/* hook for later work */
window.FACTORY={simulate,model,X,S,setInput,applyPreset,PRESETS,EVENTS,CONF_IO};
</script>
